[package]
name = "mind-palace"
version = "0.1.0"
description = "Mind Palace local-first desktop development shell"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "mind_palace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }
tokio = { version = "=1.53.1", features = ["process", "io-util", "time", "rt", "sync"] }
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep full resource hashing on every command without debug compression cost.
[profile.dev.package.sha2]
opt-level = 3
